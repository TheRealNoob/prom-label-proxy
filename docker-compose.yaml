services:
  prometheus:
    image: prom/prometheus
    user: 1000:1000
    volumes:
      - ./data/prometheus/database:/prometheus
      - ./data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana
    user: 1000:1000
    volumes:
      - ./data/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./data/grafana/database:/var/lib/grafana
    ports:
      - "3000:3000"

  dummy_exporter:
    image: kobtea/dummy_exporter:latest
    user: 1000:1000
    volumes:
      - ./data/dummy_exporter/config.yaml:/config.yaml
    command:
      - "--config=/config.yaml"

  nginx:
    image: nginx
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./data/nginx/certs:/etc/nginx/certs
    ports:
      - "443:443"
